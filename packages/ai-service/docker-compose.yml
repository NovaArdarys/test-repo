services:
  ai_service:
    build:
      context: ../..
      dockerfile: packages/ai-service/Dockerfile
    container_name: ai_service
    command: bun dev
    env_file:
      - ../../.env
      - .env
      - ../../.env
      - .env
    environment:
      - NODE_ENV=development
      - SERVICE_INTERNAL_PORT=3004
      - SERVICE_HOST_PORT=3004
    ports:
      - "3004:3004"
    volumes:
      - ../..:/app:cached
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3004/api/health  || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
