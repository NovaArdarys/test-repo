services:
  delivery_service:
    build:
      context: ../..
      dockerfile: packages/delivery-service/Dockerfile
    container_name: delivery_service
    env_file:
      - ../../.env
      - .env
    environment:
      - NODE_ENV=development
      - SERVICE_INTERNAL_PORT=3005
      - SERVICE_HOST_PORT=3005
    ports:
      - "3005:3005"
    volumes:
      - ../..:/app:cached
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3005/api/health  || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
