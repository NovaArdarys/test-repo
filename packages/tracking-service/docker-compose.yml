# version: '3.8'

services:
  tracking_service:
    build:
      context: ../.. 
      dockerfile: packages/tracking-service/Dockerfile
    container_name: tracking_service
    command: bun dev
    env_file:
      - ../../.env
      - .env
      - ../../.env
      - .env
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=Auth Service
      - SERVICE_NAME_DIR=tracking-service
      - SERVICE_INTERNAL_PORT=${SERVICE_INTERNAL_PORT:-3001}
      - SERVICE_HOST_PORT=${SERVICE_HOST_PORT:-3001}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
    ports:
      - "${SERVICE_HOST_PORT:-3000}:${SERVICE_INTERNAL_PORT:-3000}"
    volumes:
      - ../..:/app
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${SERVICE_INTERNAL_PORT:-3000}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: on-failure:5