apiVersion: v1
kind: Namespace
metadata:
  name: prod
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: common-config
  namespace: prod
  labels:
    app: common
data:
  NODE_ENV: 'production'
  LOG_LEVEL: 'info'
  RABBITMQ_HOST: 'rabbitmq.prod.svc.cluster.local'
  RABBITMQ_PORT: '5672'
  REDIS_HOST: 'redis.prod.svc.cluster.local'
  REDIS_PORT: '6379'
---
apiVersion: v1
kind: Secret
metadata:
  name: service-secrets
  namespace: prod
  labels:
    app: common
type: Opaque
