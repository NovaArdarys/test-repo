apiVersion: apps/v1
kind: Deployment
metadata:
  name: school-service
  namespace: prod
  labels:
    app: school-service
spec:
  replicas: 2 # banyaknya replika
  selector:
    matchLabels:
      app: school-service
  template:
    metadata:
      labels:
        app: school-service
    spec:
      serviceAccountName: default-sa
      containers:
        - name: school
          image: rahvanna/school-service:latest
          ports:
            - containerPort: 3010
              name: http
          envFrom:
            - configMapRef:
                name: common-config
            - secretRef:
                name: common-secret
          env:
            - name: PORT
              value: '3010'
            - name: SERVICE_NAME
              value: 'school-service'
          resources:
            requests: # minimum CPU (100m) dan memori (64Mi)
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 125m
              memory: 192Mi
          # readinessProbe:
          #   httpGet:
          #     path: /health
          #     port: 3010
          #   initialDelaySeconds: 5
          #   periodSeconds: 10
          # livenessProbe:
          #   httpGet:
          #     path: /health
          #     port: 3010
          #   initialDelaySeconds: 15
          #   periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: school-service
  namespace: prod
  labels:
    app: school-service
spec:
  selector:
    app: school-service
  ports:
    - port: 3010
      targetPort: 3010
      protocol: TCP
      name: http
  type: ClusterIP
