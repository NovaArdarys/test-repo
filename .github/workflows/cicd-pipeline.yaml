name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      
env:
  NAMESPACE: prod

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Detect changed services
        id: changes
        run: |
          changed_dirs=$(git diff --name-only HEAD~1 HEAD | grep '^packages/' | cut -d'/' -f2 | grep '\-service$' | sort -u)
          services=$(echo "$changed_dirs" | jq -R -s -c 'split("\n")[:-1]')
          echo "services=$services" >> $GITHUB_OUTPUT

#Build and push
  build:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    
    steps:
      - uses: actions/checkout@v4

      - name: 🔍 Create Docker Tag
        id: vars
        run: |
          IMAGE_TAG="${GITHUB_SHA:0:7}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: 📦 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 🔍 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: 📦 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./packages/${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ steps.vars.outputs.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  #Step Deploy
  deploy:
    runs-on: ubuntu-latest
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.services != '[]'
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - name: Set image tag
        id: vars
        run: |
          IMAGE_TAG="${GITHUB_SHA:0:7}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT
  
      - name: 🔄 Deploy ${{ matrix.service }} 
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e  # Exit on any error
            DEPLOYMENT_NAME="${{ matrix.service }}"
            CONTAINER_NAME=$(kubectl -n ${{ env.NAMESPACE }} get deployment/$DEPLOYMENT_NAME -o jsonpath='{.spec.template.spec.containers[0].name}')
            
            # deploy
            kubectl -n ${{ env.NAMESPACE }} set image deployment/$DEPLOYMENT_NAME \
              $CONTAINER_NAME=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ steps.vars.outputs.IMAGE_TAG }}
            
            #validate
            kubectl -n ${{ env.NAMESPACE }} rollout status deployment/$DEPLOYMENT_NAME --timeout=300s

